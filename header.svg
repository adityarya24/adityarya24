<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Aditya Arya: builds tools for people who run AI coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14130f"/>
      <stop offset="1" stop-color="#1c1a15"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <g stroke="#26241e" stroke-width="1">
    <path d="M0 75H1200M0 150H1200M0 225H1200"/>
    <path d="M150 0V300M300 0V300M450 0V300M600 0V300M750 0V300M900 0V300M1050 0V300"/>
  </g>

  <text x="64" y="92" fill="#f5a524" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3">CAFÉ → TRADER → BUILDER</text>
  <text x="62" y="170" fill="#f3f0e8" font-family="Georgia, 'Times New Roman', serif" font-size="74">Aditya <tspan fill="#f5a524" font-style="italic">Arya</tspan></text>
  <text x="64" y="222" fill="#a9a59b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">I build tools for people who run AI coding agents.</text>

  <!-- the notch -->
  <g transform="translate(1030 40)">
    <rect width="84" height="220" rx="42" fill="#0a0a09" stroke="#2b2923"/>
    <g fill="none" stroke-width="5" stroke-linecap="round">
      <circle cx="42" cy="46" r="18" stroke="#2b2923"/>
      <circle cx="42" cy="46" r="18" stroke="#f5a524" stroke-dasharray="62 113" transform="rotate(-90 42 46)">
        <animate attributeName="stroke-dasharray" values="62 113;70 113;62 113" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="42" cy="110" r="18" stroke="#2b2923"/>
      <circle cx="42" cy="110" r="18" stroke="#e5484d" stroke-dasharray="99 113" transform="rotate(-90 42 110)"/>
      <circle cx="42" cy="174" r="18" stroke="#2b2923"/>
      <circle cx="42" cy="174" r="18" stroke="#34d399" stroke-dasharray="24 113" transform="rotate(-90 42 174)" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
      <text x="42" y="50" fill="#f5a524">55%</text>
      <text x="42" y="114" fill="#e5484d">88%</text>
      <text x="42" y="178" fill="#34d399">21%</text>
    </g>
  </g>
</svg>
